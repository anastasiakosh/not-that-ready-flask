<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandwich Style</title>
<style>
  body, html { margin: 0; padding: 0; box-sizing: border-box; }
  .sandwich-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #ffffff;
    color: #111111;
    font-family: 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }

  .sandwich-text {
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 900;
    line-height: 0.9;
    text-align: center;
    margin: 0;
    z-index: 10;
    letter-spacing: -2px;
    text-transform: uppercase;
  }

  .sandwich-text.sub {
    color: #cccccc;
  }

  .sandwich-stack {
    position: relative;
    width: 320px;
    height: 220px;
    margin: 2rem 0;
    z-index: 5;
    cursor: pointer;
  }

  .stack-item {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .item-1 { background: #e0e0e0; z-index: 3; }
  .item-2 { background: #d0d0d0; z-index: 2; }
  .item-3 { background: #c0c0c0; z-index: 1; }
</style>
</head>
<body>

<div class="sandwich-section">
  <h1 class="sandwich-text">ANASTASIIA KOSHELEVA</h1>
  
  <div class="sandwich-stack" id="imageStack">
    <div class="stack-item item-3">Project 3</div>
    <div class="stack-item item-2">Project 2</div>
    <div class="stack-item item-1">Project 1</div>
  </div>
  
  <h2 class="sandwich-text sub">UX/UI<br>DESIGNER & ANIMATOR</h2>
</div>

<script>
  const stack = document.getElementById('imageStack');
  const items = document.querySelectorAll('.stack-item');

  stack.addEventListener('mouseenter', () => {
    // Fan out the cards on hover
    items[0].style.transform = 'translate(40px, 15px) rotate(8deg)';
    items[1].style.transform = 'translate(0px, -15px) rotate(0deg)';
    items[2].style.transform = 'translate(-40px, 15px) rotate(-8deg)';
  });

  stack.addEventListener('mouseleave', () => {
    // Return to stacked position
    items.forEach(item => {
      item.style.transform = 'translate(0px, 0px) rotate(0deg)';
    });
  });
</script>

</body>
</html>
